<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chakib | Mode homme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/chakib.css">
<style>
  body { margin: 0; background: var(--ck-black); }
  .ck-header { position: absolute; z-index: 5; inset: 0 0 auto 0; display: flex; align-items: center;
    justify-content: space-between; padding: 18px clamp(20px, 6vw, 96px); font-family: var(--ck-sans); }
  .ck-header img { height: 44px; mix-blend-mode: lighten; filter: contrast(1.8) brightness(.9); }
  .ck-header nav { display: flex; gap: 28px; }
  .ck-header a { color: var(--ck-ivory); text-decoration: none; font-size: .95rem; }
  .ck-header a:hover { color: var(--ck-gold-light); }
  @media (max-width: 749px) { .ck-header nav { display: none; } }
</style>
</head>
<body>
<header class="ck-header">
  <img src="assets/chakib-logo.jpg" alt="Chakib">
  <nav><a href="#">Costumes</a><a href="#">Chemises</a><a href="#">Manteaux</a><a href="#">Accessoires</a></nav>
</header>

<section class="ck-hero" data-ck-hero>
  <div class="ck-hero__fallback"></div>
  <canvas class="ck-hero__canvas" aria-hidden="true"></canvas>
  <div class="ck-hero__content">
    <p class="ck-hero__eyebrow">CHAKIB</p>
    <h1 class="ck-hero__title">Un monde d'<span>élégance</span> masculine</h1>
    <p class="ck-hero__sub">L'art du style gentleman</p>
    <div class="ck-hero__actions">
      <a class="ck-btn ck-btn--gold" href="#">Acheter maintenant</a>
      <a class="ck-btn" href="#">Découvrir la collection</a>
    </div>
  </div>
</section>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module" src="assets/chakib-hero.js"></script>
</body>
</html>
